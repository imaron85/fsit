[versions]
fabric-loom = "1.15-SNAPSHOT"
fabric-loader = "0.18.2"

configurate = "4.2.0"

mod-publish = "1.1.0"
shadow = "9.3.0"

geyser-api = "2.8.3-SNAPSHOT"

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
mod-publish = { id = "me.modmuss50.mod-publish-plugin", version.ref = "mod-publish" }

shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

[libraries]
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }

configurate-core = { module = "org.spongepowered:configurate-core", version.ref = "configurate" }
configurate-gson = { module = "org.spongepowered:configurate-gson", version.ref = "configurate" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }

geyser-api = { module = "org.geysermc.geyser:api", version.ref = "geyser-api" }

fabric-loader-junit = { module = "net.fabricmc:fabric-loader-junit", version.ref = "fabric-loader" }

[bundles]
configurate = ["configurate-core", "configurate-gson", "configurate-yaml"]

name: 🐞 Bug report
about: File a bug report
title: "bug: "
labels: [bug]
assignees: rvbsm

body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!

  - type: textarea
    attributes:
      label: 🔍 What happened?
      description: Also, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true

  - type: input
    attributes:
      label: 📦 Version
      description: What version of mod are you running?
    validations:
      required: true
  - type: input
    attributes:
      label: ⛏ Minecraft Version
      description: What version of Minecraft are you using?
    validations:
      required: true

  - type: input
    attributes:
      label: 📃 Log output
      description: Please share your log with https://mclo.gs or any other publicly available paste service.
      placeholder: https://mclo.gs/*******
      validations:
        required: false
  - type: textarea
    attributes:
      label: 📃 Relevant log output
      description: Or copy and paste any relevant log output here.
      render: shell
      validations:
        required: false

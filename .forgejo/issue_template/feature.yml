name: 🛠 Feature Request
about: File a suggestion or feature request
title: "feat: "
labels: [enhancement]
assignees: rvbsm

body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a feature request. Please fill out this form as completely as possible.

  - type: textarea
    attributes:
      label: ✍️ Describe the feature you'd like to request
      description: Please describe the feature as clear and concise as possible. Remember to add context as to why you believe this feature is needed.
    validations:
      required: true

  - type: textarea
    attributes:
      label: ℹ️ Additional information
      description: Add any other information related to the feature here. If your feature request is related to any issues or discussions, link them here.
